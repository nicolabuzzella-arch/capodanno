<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Capodanno">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<title>Capodanno</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="aura" aria-hidden="true"><b></b><b></b><b></b><b></b></div>
<div class="grain" aria-hidden="true"></div>
<div id="root"><div class="splash">Capodanno</div></div>
<div class="composer" id="composer">
  <div class="reply-bar glass" id="reply-bar" hidden></div>
  <form class="inner glass" id="composer-form">
    <textarea id="composer-input" rows="1" placeholder="Chiedi all'assistente…" enterkeyhint="send"></textarea>
    <button class="send" id="composer-send" type="submit" aria-label="Invia">↑</button>
    <button class="send nudge" id="composer-nudge" type="button" data-act="nudge-pick" aria-label="Manda un trillo" hidden></button><button class="send cam" id="composer-cam" type="button" data-act="photo-pick" aria-label="Manda una foto"><svg class="i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3v10.5H4Z"/><circle cx="12" cy="13.5" r="3.6"/></svg></button><input type="file" accept="image/*,video/*" id="composer-photo-input" hidden>
    <button class="send mic" id="composer-mic" type="button" data-act="voice-start" aria-label="Messaggio vocale" hidden></button>
  </form>
  <div class="rec-bar glass" id="rec-bar" hidden></div>
</div>
<nav class="dock glass" id="dock" hidden></nav>
<button class="fab" id="fab" hidden data-act="chat-go" data-v="ai" aria-label="Chiedi a Zampone"></button>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div id="game" hidden></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script src="voice.js"></script>
<script src="sezioni.js"></script>
<script src="killer-lib.js"></script>
<script src="games.js"></script>
<script src="chess-engine.js"></script>
<script src="chess.js"></script>
<script src="giochi2.js"></script>
<script src="scopa.js"></script>
<script src="home2.js"></script>
<script src="mail.js"></script>
<script src="mappa3d.js"></script>
<script src="extra.js"></script>
<script src="duelli.js"></script>
<script src="onorevoli.js"></script>
<script src="poker.js"></script>
<script src="squadre.js"></script>
</body>
</html>
